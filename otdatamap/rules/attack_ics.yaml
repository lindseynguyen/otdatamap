                tactics: [TA0110, TA0109]}

# What an adversary gains from each class of data once they hold a copy.
# "why" is printed by `otdatamap attack`, so the mapping can be argued with.
class_enables:
  substation-config:
    techniques: [T0840, T0846, T0888, T0861, T0836, T1692, T0848, T0882]
    why: >-
      An SCD names every IED with its address, and every GOOSE/SV control block
      with its APPID, destination MAC and DataSet. That is the network map and
      the publisher identity an attacker would otherwise have to sniff for, and
      it is what a spoofed publisher needs to be believed.
  plc-program:
    techniques: [T0845, T0843, T0889, T0873, T0821, T0861, T0882]
    why: >-
      The control logic itself: tags, routines and I/O. Holding it removes the
      need to upload the program from the controller, and it is what an attacker
      edits before downloading a modified one back.
  hmi-project:
    techniques: [T0832, T0838, T0878, T0861, T0882]
    why: >-
      Screens, tags and alarm configuration - what the operator sees, and what
      must be changed for a manipulation to stay invisible.
  network-device-config:
    techniques: [T0840, T0888, T0859, T1694, "T1694.001", T0886]
    why: >-
      Interfaces, VLANs, routes and ACLs, usually with credentials or hashes in
      the same file. It describes the conduit and often hands over the keys.
  credential-store:
    techniques: [T0859, T1694, "T1694.001", T0892, T0822]
    why: Authentication the attacker does not have to break.
  system-backup:
    techniques: [T0893, T0811, T0859, T0882]
    why: >-
      A backup holds everything the live system holds, including credential
      material, with none of the live system's monitoring.
  process-capture:
    techniques: [T0842, T0861, T0830, T0882]
    why: >-
      A capture is sniffing that has already happened: protocols, addresses,
      point values and the message formats needed to inject a credible one.
  historian-export:
    techniques: [T0801, T0802, T0811, T0882]
    why: >-
      Process values over time - the baseline an attacker needs to know what
      "normal" looks like, and to stay inside it.
  disturbance-record:
    techniques: [T0801, T0882]
    why: Channel configuration and real waveforms from the protection system.
  engineering-drawing:
    techniques: [T0888, T0879, T0882]
    why: >-
      Single line diagrams tell an attacker which breaker matters, which is the
      difference between disruption and damage.
  asset-register:
    techniques: [T0846, T0840, T0888]
    why: The discovery step, handed over as a spreadsheet.
  personal-data:
    techniques: [T0865, T0863]
    why: >-
      Names, roles and shift patterns are what makes a phishing mail land, and
      tell an attacker who is not at the console tonight.
  firmware-image:
    techniques: [T1693, T0800, T0862, T0820]
    why: >-
      Firmware can be analysed offline for vulnerabilities and rebuilt into an
      implant that the device will accept.
  device-description:
    techniques: [T0888, T0861]
    why: Vendor, model and firmware revision - the version half of a CVE lookup.
  log-data:
    techniques: [T0872, T0888]
    why: Knowing what is logged tells an attacker what not to trigger.
  vendor-document:
    techniques: ["T1694.001", T0888]
    why: Manuals carry default credentials and engineering access procedures.
  unclassified:
    techniques: []
    why: ""

# What the exposure itself buys, independent of the data class.
finding_techniques:
  DATA-SECRET-CLEARTEXT: [T0859, T1694, "T1694.001", T0892, T0822]
  DATA-RESTRICTED-EGRESS: [T0882, T0847, T0864]
  DATA-RESTRICTED-IN-SHARED: [T0811, T0893, T0882]
  DATA-BROAD-ACCESS: [T0811, T0893, T0859]
  DATA-OUTSIDE-ZONE: [T0811, T0882]
  DATA-SPRAWL-DUPLICATE: [T0802, T0811]
  DATA-UNDECLARED-STORE: [T0811, T0849]
  DATA-RETENTION-EXCEEDED: [T0882]
  DATA-STALE: [T0809, T0828]
  DATA-NO-OWNER: [T0811]
