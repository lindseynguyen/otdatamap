# MITRE ATT&CK for ICS - the subset that data at rest actually enables.
#
# The question this file answers is not "which technique is vaguely related"
# but: if an adversary reads or alters THIS data, which step of an ICS attack
# does it pay for? Engineering data is reconnaissance that has already been
# done, and credentials are lateral movement that has already been paid for.
#
# Technique IDs follow the current ATT&CK for ICS matrix. Several older IDs
# were folded into parent techniques (T0812 Default Credentials ->
# T1694.001, T0857/T0839 firmware -> T1693.001/.002); the new IDs are used.
#
# Everything here is editable: override the whole file with --attack.

version: 1
matrix: ics-attack

tactics:
  - {id: TA0108, name: Initial Access}
  - {id: TA0104, name: Execution}
  - {id: TA0110, name: Persistence}
  - {id: TA0111, name: Privilege Escalation}
  - {id: TA0103, name: Evasion}
  - {id: TA0102, name: Discovery}
  - {id: TA0109, name: Lateral Movement}
  - {id: TA0100, name: Collection}
  - {id: TA0101, name: Command and Control}
  - {id: TA0107, name: Inhibit Response Function}
  - {id: TA0106, name: Impair Process Control}
  - {id: TA0105, name: Impact}

techniques:
  T0800: {name: Activate Firmware Update Mode, tactics: [TA0107]}
  T0801: {name: Monitor Process State, tactics: [TA0100]}
  T0802: {name: Automated Collection, tactics: [TA0100]}
  T0809: {name: Data Destruction, tactics: [TA0107]}
  T0811: {name: Data from Information Repositories, tactics: [TA0100]}
  T0820: {name: Exploitation for Evasion, tactics: [TA0103]}
  T0821: {name: Modify Controller Tasking, tactics: [TA0104]}
  T0822: {name: External Remote Services, tactics: [TA0108]}
  T0828: {name: Loss of Productivity and Revenue, tactics: [TA0105]}
  T0830: {name: Adversary-in-the-Middle, tactics: [TA0100]}
  T0832: {name: Manipulation of View, tactics: [TA0105]}
  T0836: {name: Modify Parameter, tactics: [TA0106]}
  T0838: {name: Modify Alarm Settings, tactics: [TA0107]}
  T0840: {name: Network Connection Enumeration, tactics: [TA0102]}
  T0842: {name: Network Sniffing, tactics: [TA0102]}
  T0843: {name: Program Download, tactics: [TA0109]}
  T0845: {name: Program Upload, tactics: [TA0100]}
  T0846: {name: Remote System Discovery, tactics: [TA0102]}
  T0847: {name: Replication Through Removable Media, tactics: [TA0108]}
  T0848: {name: Rogue Master, tactics: [TA0108]}
  T0849: {name: Masquerading, tactics: [TA0103]}
  T0859: {name: Valid Accounts, tactics: [TA0110, TA0109]}
  T0861: {name: Point & Tag Identification, tactics: [TA0100]}
  T0862: {name: Supply Chain Compromise, tactics: [TA0108]}
  T0863: {name: User Execution, tactics: [TA0104]}
  T0864: {name: Transient Cyber Asset, tactics: [TA0108]}
  T0865: {name: Spearphishing Attachment, tactics: [TA0108]}
  T0872: {name: Indicator Removal on Host, tactics: [TA0103]}
  T0873: {name: Project File Infection, tactics: [TA0110]}
  T0878: {name: Alarm Suppression, tactics: [TA0107]}
  T0879: {name: Damage to Property, tactics: [TA0105]}
  T0882: {name: Theft of Operational Information, tactics: [TA0105]}
  T0886: {name: Remote Services, tactics: [TA0108, TA0109]}
  T0888: {name: Remote System Information Discovery, tactics: [TA0102]}
  T0889: {name: Modify Program, tactics: [TA0110]}
  T0892: {name: Change Credential, tactics: [TA0107]}
  T0893: {name: Data from Local System, tactics: [TA0100]}
  T1692: {name: Unauthorized Message, tactics: [TA0103, TA0106]}
  T1693: {name: Modify Firmware, tactics: [TA0110, TA0107, TA0106]}
